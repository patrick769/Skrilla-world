<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>SKRILLA HQ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;background:#000;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
  body{height:500vh} /* scroll runway */
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
  #overlay{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    flex-direction:column;pointer-events:none;will-change:opacity,transform}
  #overlay h1{font-size:clamp(28px,7vw,86px);letter-spacing:.32em;font-weight:200;
    text-shadow:0 0 22px rgba(160,120,255,.85),0 0 60px rgba(80,120,255,.45)}
  #overlay p{margin-top:18px;font-size:clamp(9px,1.4vw,13px);letter-spacing:.55em;opacity:.55}
  #scrollhint{position:fixed;bottom:26px;left:0;right:0;text-align:center;z-index:3;font-size:10px;
    letter-spacing:.45em;opacity:.4;pointer-events:none}
  #loader{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;
    justify-content:center;flex-direction:column;transition:opacity .9s ease}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .lbl{font-size:11px;letter-spacing:.5em;opacity:.6;margin-bottom:16px}
  #bar{width:min(280px,60vw);height:1px;background:#222;overflow:hidden}
  #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7a5cff,#37b6ff);transition:width .25s}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="overlay"><h1>SKRILLA HQ</h1><p>ENTER</p></div>
<div id="scrollhint">SCROLL TO WALK IN</div>
<div id="loader"><div class="lbl">LOADING SKRILLA HQ</div><div id="bar"><i></i></div></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050a);
scene.fog = new THREE.FogExp2(0x07070d, 0.055);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 8);   // doorway
camera.lookAt(0, 1.6, 0);

/* ---------- MATERIALS ---------- */
const matWall  = new THREE.MeshStandardMaterial({color:0x0b0b0e, roughness:.95, metalness:.02});
const matFloor = new THREE.MeshStandardMaterial({color:0x17171a, roughness:.55, metalness:.15});
const matCeil  = new THREE.MeshStandardMaterial({color:0x060608, roughness:1});
const matDark  = new THREE.MeshStandardMaterial({color:0x121215, roughness:.6, metalness:.3});
const matBlack = new THREE.MeshStandardMaterial({color:0x08080a, roughness:.4, metalness:.5});

const R = 8, H = 3.2, half = R/2;
const room = new THREE.Group(); scene.add(room);

function plane(w,h,mat,pos,rot){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
  m.position.set(...pos); if(rot) m.rotation.set(...rot); room.add(m); return m;
}
plane(R,R,matFloor,[0,0,0],[-Math.PI/2,0,0]);
plane(R,R,matCeil,[0,H,0],[Math.PI/2,0,0]);
plane(R,H,matWall,[0,H/2,-half]);                        // back
plane(R,H,matWall,[0,H/2,half],[0,Math.PI,0]);           // front
plane(R,H,matWall,[-half,H/2,0],[0,Math.PI/2,0]);        // left
plane(R,H,matWall,[half,H/2,0],[0,-Math.PI/2,0]);        // right

/* ---------- NEON SIGN "SKRILLA HQ" (tube-ish extruded strokes) ---------- */
const neonMat = new THREE.MeshStandardMaterial({
  color:0xffffff, emissive:0xffffff, emissiveIntensity:3.2, roughness:.3, metalness:0
});
const signGroup = new THREE.Group();
signGroup.position.set(0, 2.05, -half+0.14);
room.add(signGroup);

// Build glyphs from a canvas texture (crisp + cheap) plus emissive plane for bloom
const tc = document.createElement('canvas'); tc.width=1024; tc.height=256;
const tx = tc.getContext('2d');
tx.clearRect(0,0,1024,256);
tx.font='700 120px "Helvetica Neue",Arial,sans-serif';
tx.textAlign='center'; tx.textBaseline='middle';
tx.shadowColor='#bcd2ff'; tx.shadowBlur=40;
tx.fillStyle='#ffffff';
tx.letterSpacing='14px';
for(let i=0;i<4;i++) tx.fillText('SKRILLA HQ',512,132);
const signTex = new THREE.CanvasTexture(tc);
signTex.colorSpace = THREE.SRGBColorSpace;
const sign = new THREE.Mesh(
  new THREE.PlaneGeometry(4.0,1.0),
  new THREE.MeshBasicMaterial({map:signTex, transparent:true, toneMapped:false})
);
signGroup.add(sign);
// backing box
const signBack = new THREE.Mesh(new THREE.BoxGeometry(4.3,1.25,.08), matBlack);
signBack.position.z = -0.06; signGroup.add(signBack);

const neonLight = new THREE.PointLight(0xdbe6ff, 14, 11, 2);
neonLight.position.set(0,2.05,-half+0.6); room.add(neonLight);

/* ---------- DESK ---------- */
const desk = new THREE.Group(); desk.position.set(0,0,-2.6); room.add(desk);
const top = new THREE.Mesh(new THREE.BoxGeometry(3.2,.08,1.0), matDark);
top.position.y=.75; desk.add(top);
[-1.5,1.5].forEach(x=>{
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.08,.75,.9), matBlack);
  leg.position.set(x,.375,0); desk.add(leg);
});

// monitors
function monitor(x,y,z,w,h,ry,hue){
  const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry;
  const frame=new THREE.Mesh(new THREE.BoxGeometry(w,h,.05), matBlack); g.add(frame);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(w*.94,h*.9),
    new THREE.MeshBasicMaterial({color:hue, toneMapped:false}));
  scr.position.z=.027; g.add(scr);
  const stand=new THREE.Mesh(new THREE.BoxGeometry(.06,.22,.06), matBlack);
  stand.position.y=-h/2-.11; g.add(stand);
  desk.add(g);
  const l=new THREE.PointLight(hue,2.2,3.2,2); l.position.set(x,y,z+.5); desk.add(l);
  return g;
}
monitor(0,1.18,-.30,1.25,.7,0,0x2b6bff);
monitor(-1.10,1.14,-.22,.85,.55,.32,0x6a3cff);
monitor(1.10,1.14,-.22,.85,.55,-.32,0x1f8fff);

// speakers
function speaker(x){
  const s=new THREE.Mesh(new THREE.BoxGeometry(.28,.44,.26), matBlack);
  s.position.set(x,1.01,-.25); desk.add(s);
  const cone=new THREE.Mesh(new THREE.CircleGeometry(.09,24),
    new THREE.MeshStandardMaterial({color:0x1a1a1f,roughness:.7}));
  cone.position.set(x,1.01,-.11); desk.add(cone);
}
speaker(-1.55); speaker(1.55);

// keyboard / mpc
const mpc=new THREE.Mesh(new THREE.BoxGeometry(1.1,.05,.35), matDark);
mpc.position.set(0,.82,.18); desk.add(mpc);
for(let i=0;i<4;i++)for(let j=0;j<4;j++){
  const p=new THREE.Mesh(new THREE.BoxGeometry(.09,.02,.07),
    new THREE.MeshBasicMaterial({color:i%2?0x8a5cff:0x34a8ff, toneMapped:false}));
  p.position.set(-.33+j*.22,.86,.05+i*.08); desk.add(p);
}

/* ---------- LED STRIPS ---------- */
function strip(w,h,d,pos,color,rot){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshBasicMaterial({color, toneMapped:false}));
  m.position.set(...pos); if(rot)m.rotation.set(...rot); room.add(m);
  return m;
}
strip(R-.2,.035,.035,[0,H-.12,-half+.08],0x7b3cff);
strip(.035,.035,R-.2,[-half+.08,H-.12,0],0x2f7bff);
strip(.035,.035,R-.2,[ half-.08,H-.12,0],0x7b3cff);
strip(3.3,.03,.03,[0,.70,-2.10],0x9a4cff);
const ledA=new THREE.PointLight(0x7b3cff,6,9,2); ledA.position.set(-2.6,H-.4,-1); room.add(ledA);
const ledB=new THREE.PointLight(0x2f7bff,6,9,2); ledB.position.set(2.6,H-.4,-1); room.add(ledB);
const deskGlow=new THREE.PointLight(0x9a4cff,4,4,2); deskGlow.position.set(0,.8,-2.2); room.add(deskGlow);

/* ---------- POSTERS ---------- */
function poster(x,y,z,ry,c1,c2){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=352;
  const g=cv.getContext('2d');
  const grd=g.createLinearGradient(0,0,256,352); grd.addColorStop(0,c1); grd.addColorStop(1,c2);
  g.fillStyle=grd; g.fillRect(0,0,256,352);
  g.fillStyle='rgba(255,255,255,.9)'; g.font='700 30px Arial'; g.textAlign='center';
  g.fillText('SKRILLA',128,300); g.font='300 13px Arial'; g.fillText('WORLD TOUR',128,325);
  g.beginPath(); g.arc(128,150,64,0,Math.PI*2); g.fillStyle='rgba(0,0,0,.45)'; g.fill();
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.1),
    new THREE.MeshStandardMaterial({map:t, roughness:.9}));
  m.position.set(x,y,z); m.rotation.y=ry; room.add(m);
}
poster(-half+.05,1.9,-1.2,Math.PI/2,'#3b1d7a','#0b0b22');
poster(-half+.05,1.9, .4,Math.PI/2,'#0d3b63','#0a0a1a');
poster( half-.05,1.9,-1.0,-Math.PI/2,'#5c1d4a','#120a1a');

/* ---------- PLANTS ---------- */
function plant(x,z,s=1){
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(s);
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(.18,.13,.3,16),
    new THREE.MeshStandardMaterial({color:0x1b1b1f,roughness:.9}));
  pot.position.y=.15; g.add(pot);
  const leafMat=new THREE.MeshStandardMaterial({color:0x1d4a2a,roughness:.8,side:THREE.DoubleSide});
  for(let i=0;i<9;i++){
    const l=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6), leafMat);
    l.scale.set(.35,1.5,.35);
    l.position.set(Math.sin(i*1.7)*.16,.45+Math.random()*.45,Math.cos(i*1.7)*.16);
    l.rotation.z=Math.sin(i)*.35; l.rotation.x=Math.cos(i)*.3;
    g.add(l);
  }
  room.add(g);
}
plant(-3.2,-3.2,1.15); plant(3.2,-3.0,1); plant(2.9,1.6,.85);

/* ---------- AMBIENT FOG PARTICLES ---------- */
const N=380, pos=new Float32Array(N*3);
for(let i=0;i<N;i++){
  pos[i*3]=(Math.random()-.5)*R*.95;
  pos[i*3+1]=Math.random()*H;
  pos[i*3+2]=(Math.random()-.5)*R*.95;
}
const dustGeo=new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
const dust=new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color:0x9fb6ff, size:.022, transparent:true, opacity:.5, depthWrite:false
}));
scene.add(dust);

/* ---------- LIGHTING (soft baked-feel) ---------- */
scene.add(new THREE.AmbientLight(0x30364d, .55));
scene.add(new THREE.HemisphereLight(0x4a5a8a, 0x0a0a0c, .35));
const key=new THREE.SpotLight(0xbfd4ff,18,12,.75,.5,2);
key.position.set(0,H-.25,-1.2); key.target.position.set(0,.8,-2.6);
room.add(key, key.target);

/* ---------- POST / BLOOM ---------- */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.95, 0.65, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- CAMERA LOGIC (no OrbitControls) ---------- */
const state={z:8, mx:0, my:0, tmx:0, tmy:0};
const MAXDEG=10*Math.PI/180;

addEventListener('pointermove', e=>{
  state.tmx=(e.clientX/innerWidth)*2-1;
  state.tmy=(e.clientY/innerHeight)*2-1;
}, {passive:true});

gsap.registerPlugin(ScrollTrigger);
const overlay=document.getElementById('overlay');
const hint=document.getElementById('scrollhint');

ScrollTrigger.create({
  trigger:document.body, start:'top top', end:'bottom bottom', scrub:1.1,
  onUpdate:self=>{
    const p=self.progress;
    state.z = 8 - p*6;                 // 8 -> 2
    const o = Math.max(0, 1 - p*3.2);
    overlay.style.opacity=o;
    overlay.style.transform=`translateY(${-p*60}px) scale(${1+p*.12})`;
    hint.style.opacity = o*0.4;
  }
});

const lerp=(a,b,t)=>a+(b-a)*t;
let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min((now-last)/1000,.05); last=now;
  const k=1-Math.pow(0.001, dt);       // frame-rate independent smoothing

  state.mx=lerp(state.mx,state.tmx,k);
  state.my=lerp(state.my,state.tmy,k);

  camera.position.z = lerp(camera.position.z, state.z, k);
  camera.position.x = lerp(camera.position.x, state.mx*0.25, k);
  camera.position.y = lerp(camera.position.y, 1.6 - state.my*0.10, k);

  camera.rotation.order='YXZ';
  camera.rotation.y = -state.mx*MAXDEG;
  camera.rotation.x = -state.my*MAXDEG;

  const t=now*0.001;
  neonLight.intensity = 13 + Math.sin(t*9.1)*Math.sin(t*2.3)*1.6;
  sign.material.opacity = 0.93 + Math.sin(t*13.7)*0.05;
  sign.material.transparent = true;
  dust.rotation.y = t*0.012;
  dust.position.y = Math.sin(t*0.3)*0.05;

  composer.render();
}

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});

/* ---------- LOADER ---------- */
const loader=document.getElementById('loader'), bar=document.querySelector('#bar i');
let prog=0;
const fake=setInterval(()=>{
  prog=Math.min(100, prog+Math.random()*18);
  bar.style.width=prog+'%';
  if(prog>=100){
    clearInterval(fake);
    renderer.compile(scene,camera);
    requestAnimationFrame(tick);
    setTimeout(()=>{ loader.classList.add('hide'); ScrollTrigger.refresh(); }, 350);
    gsap.from(overlay,{opacity:0,y:30,duration:1.6,delay:.5,ease:'power3.out'});
  }
},120);
</script>
</body>
</html>
